
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C.R.I.S. - Ordem Paranormal</title>

  <style>
    :root {
      --bg: #1e2231;
      --bar: #292d40;
      --text: #e8e6f0;
      --muted: #9aa0b8;
      --accent: #7a5cd6;
      --button: #41465e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #window-bar {
      height: 43px;
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: var(--bar);
      border-bottom: 1px solid #454963;
      user-select: none;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 5px;
    }

    button {
      width: 30px;
      height: 28px;
      border: 0;
      border-radius: 5px;
      background: var(--button);
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      filter: brightness(1.3);
    }

    #pin.active {
      background: var(--accent);
    }

    #cris-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: white;
    }

    #status {
      padding: 5px;
      background: #292d40;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    #resize-bar {
      height: 12px;
      min-height: 12px;
      background: var(--bg);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      cursor: ns-resize;
      touch-action: none;
    }

    #resize-bar span {
      color: #9a86dc;
      font-size: 14px;
      padding-right: 7px;
    }

    #app.minimized {
      height: 43px;
    }

    #app.minimized #cris-frame,
    #app.minimized #status,
    #app.minimized #resize-bar {
      display: none;
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="window-bar">
      <span class="title">C.R.I.S. — Ordem Paranormal</span>

      <div class="controls">
        <button id="pin" title="Fixar">📌</button>
        <button id="minimize" title="Minimizar">—</button>
        <button id="maximize" title="Maximizar">□</button>
      </div>
    </div>

    <iframe
      id="cris-frame"
      src="https://crisordemparanormal.com"
      title="C.R.I.S."
      allow="clipboard-read; clipboard-write">
    </iframe>

    <div id="status">Carregando C.R.I.S...</div>

    <div id="resize-bar">
      <span>◢</span>
    </div>

  </div>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

    const app = document.querySelector("#app");
    const iframe = document.querySelector("#cris-frame");
    const status = document.querySelector("#status");

    const pin = document.querySelector("#pin");
    const minimize = document.querySelector("#minimize");
    const maximize = document.querySelector("#maximize");
    const resizeBar = document.querySelector("#resize-bar");

    const MIN_WIDTH = 400;
    const MIN_HEIGHT = 300;
    const MAX_WIDTH = 900;
    const MAX_HEIGHT = 700;

    let pinned = false;
    let minimized = false;
    let maximized = false;
    let resizing = false;
    let reopening = false;

    let previousWidth = 760;
    let previousHeight = 560;

    async function resizeWindow(width, height) {
      width = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, width));
      height = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, height));

      await OBR.action.setWidth(width);
      await OBR.action.setHeight(height);
    }

    OBR.onReady(async () => {
      await resizeWindow(previousWidth, previousHeight);

      // Mantém o painel aberto quando o PIN estiver ativo.
      OBR.action.onOpenChange(async (isOpen) => {
        if (!isOpen && pinned && !reopening) {
          reopening = true;

          try {
            await OBR.action.open();
          } finally {
            reopening = false;
          }
        }
      });
    });

    iframe.addEventListener("load", () => {
      status.hidden = true;
    });

    // PIN
    pin.addEventListener("click", () => {
      pinned = !pinned;

      pin.classList.toggle("active", pinned);
      pin.title = pinned ? "Desafixar" : "Fixar";
    });

    // Minimizar
    minimize.addEventListener("click", async () => {
      minimized = !minimized;

      if (minimized) {
        previousHeight = await OBR.action.getHeight() || previousHeight;
        app.classList.add("minimized");
        await OBR.action.setHeight(43);
        minimize.textContent = "+";
      } else {
        app.classList.remove("minimized");
        await OBR.action.setHeight(previousHeight);
        minimize.textContent = "—";
      }
    });

    // Maximizar
    maximize.addEventListener("click", async () => {
      if (minimized) return;

      maximized = !maximized;

      if (maximized) {
        previousWidth = await OBR.action.getWidth() || previousWidth;
        previousHeight = await OBR.action.getHeight() || previousHeight;

        await resizeWindow(MAX_WIDTH, MAX_HEIGHT);
        maximize.textContent = "❐";
      } else {
        await resizeWindow(previousWidth, previousHeight);
        maximize.textContent = "□";
      }
    });

    // Redimensionamento pelo canto inferior
    resizeBar.addEventListener("pointerdown", (e) => {
      if (maximized || minimized) return;

      resizing = {
        x: e.clientX,
        y: e.clientY,
        width: previousWidth,
        height: previousHeight
      };

      resizeBar.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    resizeBar.addEventListener("pointermove", async (e) => {
      if (!resizing) return;

      const width = resizing.width + e.clientX - resizing.x;
      const height = resizing.height + e.clientY - resizing.y;

      previousWidth = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, width));
      previousHeight = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, height));

      await resizeWindow(previousWidth, previousHeight);
    });

    resizeBar.addEventListener("pointerup", () => {
      resizing = false;
    });

    resizeBar.addEventListener("pointercancel", () => {
      resizing = false;
    });

  </script>

</body>
</html>
